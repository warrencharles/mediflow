services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mediflow_prod_secret}
      POSTGRES_DB: mediflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://mediflow:${POSTGRES_PASSWORD:-mediflow_prod_secret}@db:5432/mediflow?schema=public
      CLINIC_NAME: "MediFlow Healthcare Group"
      BACKUP_CRON: "0 2 * * *"
      BACKUP_RETENTION_DAYS: 14
    volumes:
      - uploads:/app/server/uploads
      - backups:/app/server/backups

volumes:
  pgdata:
  uploads:
  backups:

